# The ucode LuCI dispatcher names the session cookie after the scheme
# (dispatcher.uc: cookie_name = HTTPS == 'on' ? 'sysauth_https' : 'sysauth_http'),
# but the quickfile backend only ever looks for "sysauth_http". Present the
# session to the backend under the name it expects; LuCI itself keeps receiving
# the original name, because this map is only used by quickfile.locations.
# Note: this file must stay installed together with quickfile.locations, which
# references $quickfile_cookie.
map $http_cookie $quickfile_cookie {
	default $http_cookie;
	"~^(?<qf_before>.*)sysauth_https=(?<qf_sid>[^;]*)(?<qf_after>.*)$" "${qf_before}sysauth_http=${qf_sid}${qf_after}";
	"~^(?<qf_pre>.*)sysauth=(?<qf_id>[^;]*)(?<qf_post>.*)$"           "${qf_pre}sysauth_http=${qf_id}${qf_post}";
}

# Loopback-only plain-HTTP vhost that serves LuCI's session-check endpoint.
#
# quickfile's backend validates the browser session by POSTing to
# "<host>/cgi-bin/luci" with the sysauth_http cookie, and it verifies TLS
# normally. Passing the address the browser used is fragile: the server
# certificate then has to be valid for that address (nginx-util's own
# certificate has no SANs at all, and a domain certificate does not cover the
# LAN IP), and access rules or DNS can block the loopback round trip.
#
# quickfile.locations therefore passes host=http://127.0.0.1:8199, so the check
# stays on this host, needs no TLS trust and cannot be influenced by the Host
# header. Only this one endpoint is served here; every other path on this
# address redirects to https, and the LAN-facing port 80 (nginx._redirect2ssl)
# is untouched.
#
# The uwsgi parameters are inlined on purpose: this file must not depend on
# /etc/nginx/uwsgi_params existing, so that it can never break `nginx -t`.
server {
	listen 127.0.0.1:8199;
	listen [::1]:8199;
	server_name _;

	location = /cgi-bin/luci {
		uwsgi_pass unix:///var/run/luci-webui.socket;
		uwsgi_modifier1 9;
		uwsgi_param QUERY_STRING    $query_string;
		uwsgi_param REQUEST_METHOD  $request_method;
		uwsgi_param CONTENT_TYPE    $content_type;
		uwsgi_param CONTENT_LENGTH  $content_length;
		uwsgi_param REQUEST_URI     $request_uri;
		uwsgi_param PATH_INFO       $document_uri;
		uwsgi_param DOCUMENT_ROOT   $document_root;
		uwsgi_param SERVER_PROTOCOL $server_protocol;
		uwsgi_param REMOTE_ADDR     $remote_addr;
		uwsgi_param SERVER_ADDR     $server_addr;
		uwsgi_param SERVER_PORT     $server_port;
		uwsgi_param SERVER_NAME     $server_name;
		uwsgi_param HTTP_COOKIE     $http_cookie;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}
